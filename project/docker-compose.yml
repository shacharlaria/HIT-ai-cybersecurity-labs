services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: soc-traffic-simulator
    environment:
      SIMULATION_INTERVAL_SECONDS: "10"
    volumes:
      - ./logs:/data
    restart: unless-stopped

  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-detector-engine
    environment:
      SCAN_INTERVAL_SECONDS: "5"
      FAILED_PASSWORD_THRESHOLD: "3"
    volumes:
      - ./logs:/data:ro
      - ./output:/output
      - ./mitre:/mitre:ro
    depends_on:
      - simulator
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: soc-streamlit-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/data:ro
      - ./output:/output:ro
    depends_on:
      - detector
    restart: unless-stopped
